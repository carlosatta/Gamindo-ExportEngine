services:

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./src:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      DB_HOST: mysql
      REDIS_HOST: redis
      CACHE_DRIVER: ${CACHE_DRIVER:-redis}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
      SESSION_DRIVER: ${SESSION_DRIVER:-redis}
      DB_DATABASE: ${DB_DATABASE:-export_engine}
      DB_USERNAME: ${DB_USERNAME:-export_engine}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - ./src:/var/www

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    entrypoint: php artisan queue:work redis --sleep=${QUEUE_SLEEP:-3} --timeout=${QUEUE_TIMEOUT:-360} --max-jobs=${QUEUE_MAX_JOBS:-1000}
    deploy:
      replicas: ${EXPORT_WORKER_CONCURRENCY:-2}
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      DB_HOST: mysql
      REDIS_HOST: redis
      CACHE_DRIVER: ${CACHE_DRIVER:-redis}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
      SESSION_DRIVER: ${SESSION_DRIVER:-redis}
      DB_DATABASE: ${DB_DATABASE:-export_engine}
      DB_USERNAME: ${DB_USERNAME:-export_engine}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - ./src:/var/www
    depends_on:
      - app
      - mysql
      - redis

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-export_engine}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_USER: ${DB_USERNAME:-export_engine}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - ./.data/mysql:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    profiles: ["dev"]
    ports:
      - "127.0.0.1:8080:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: ${DB_USERNAME:-export_engine}
      PMA_PASSWORD: ${DB_PASSWORD:-secret}
    depends_on:
      - mysql