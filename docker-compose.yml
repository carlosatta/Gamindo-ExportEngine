version: '3.8'

services:

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./src:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-true}
      DB_HOST: mysql
      DB_DATABASE: ${DB_DATABASE:-export_engine}
      DB_USERNAME: ${DB_USERNAME:-export_engine}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - ./src:/var/www

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-export_engine}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_USER: ${DB_USERNAME:-export_engine}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - ./.data/mysql:/var/lib/mysql

